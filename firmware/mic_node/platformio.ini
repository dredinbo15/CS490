; Mic node firmware: listens continuously, sends a 1.5 s WAV clip to the Pi over MQTT
; whenever the sound gets loud.
;
; One environment per node. Pick the node in the PlatformIO bar at the bottom of
; VS Code (the "env:" selector), then Upload. Rename the rooms to match your house;
; the name becomes the MQTT topic (home/audio/<name>/clip) and shows in alerts.

[platformio]
default_envs = kitchen

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = knolleary/PubSubClient@^2.8
; Each ESP32 may show up on a different COM port. Check Device Manager and change these
; if needed, or delete both lines to let PlatformIO auto-detect.
upload_port = COM4
monitor_port = COM4

[env:kitchen]
build_flags = -DNODE_NAME=\"kitchen\"

[env:living_room]
build_flags = -DNODE_NAME=\"living_room\"

[env:bedroom]
build_flags = -DNODE_NAME=\"bedroom\"
